[project]
name = "intelligent-codebase-assistant"
version = "0.1.0"
description = "Multi-agent AI system for software engineering tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.52.0",
    "openai>=1.65.0",
    "litellm>=1.60.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "google-genai>=1.70.0",
]

[project.scripts]
codebase-assistant = "codebase_assistant.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codebase_assistant"]
